# preferences.example.yaml — schema reference, safe to commit.
#
# Copy this to preferences.yaml (gitignored) and fill in your real home
# location and preferences. See CLAUDE.md's "How to interpret
# preferences.yaml" section for non-obvious matching rules — several
# fields here have semantics that are easy to get subtly wrong.

meta:
  owner_role: "Product Manager (AI specialty)"
  search_area: "Île-de-France"

home:
  label: "REPLACE_WITH_YOUR_COMMUTE_ANCHOR" # e.g. a train/metro station name.
  # Your home address — the commute origin. Geocoded once (via Base Adresse
  # Nationale) to coordinates the routing provider needs. This is the only
  # home-address data anywhere, it lives only in this gitignored file, and it
  # is sent to exactly one external service (Google Routes) for routing — never
  # to an LLM, log, digest, or letter (those see commute *minutes* only).
  address: "REPLACE_WITH_YOUR_HOME_ADDRESS" # e.g. "12 rue de la Paix, 75002 Paris"
  # Optional: skip geocoding by pinning coordinates directly (WGS84). If set,
  # `address` is not geocoded. Leave null to geocode `address` instead.
  lat: null
  lon: null

commute: # How the enrichment stage estimates commute time. See docs/enrichment.md.
  # Three strategies are computed per offer and all stored for review; the
  # fastest becomes the offer's headline commute_minutes:
  #   bike_only   — door-to-door by bike (a fast e-scooter ≈ Google bike time).
  #   bike_hybrid — rail/RER line-haul, bike/scooter for slow connector legs.
  #   no_bike     — plain public transport (any mode). The baseline.
  # The two bounds below decide when a leg is biked vs. walked vs. ruled out.
  # ZERO OR NULL DISABLES THE GUARD (never a bare comparison):
  min_bike_walk_minutes: 12  # Walk (don't bother with the scooter) any connector
                             # whose WALK time is <= this. 0/null = no lower gate.
  max_bike_distance_km: 10   # Never bike a single leg longer than this (km);
                             # take transit instead. 0/null = disable biking
                             # entirely (skip bike_only + bike_hybrid, no bike
                             # API calls at all).

hard_filters: # ONLY certainties — these reject offers outright.
  remote_policy:
    accept_onsite: true
    accept_hybrid: true
    accept_remote: true
    min_remote_days_per_week: 0 # No hard remote requirement; remote/hybrid flexibility is scored instead.

  contract_types: ["CDI"] # Reject freelance, CDD, internship, apprenticeship, etc.

  salary_floor_eur: 50000 # Annual gross. For stated ranges, compare against the upper bound, so 45–50k is kept.

  max_commute_minutes: null # null = no hard commute cap; commute is scored instead.

  seniority:
    include_keywords:
      - "product manager"
      - "product owner"
      - "PM"
      - "PO"
    exclude_keywords:
      - "junior"
      - "stage"
      - "stagiaire"
      - "intern"
      - "internship"
      - "alternance"
      - "apprenticeship"
      - "graduate program"

  company_blocklist: []

scoring_rubric:
  ideal_role_description: >
    Replace with a short natural-language description of your ideal role
    and company — what you want to bridge (e.g. customer needs, product
    strategy, technical feasibility), and what company stage/size fits.

  criteria:
    # Weights are relative, not required to sum to 100 — see CLAUDE.md.
    - name: weekly_commute_fit
      weight: 9
      description: >
        Describe how commute time should be scored (e.g. total weekly
        commute = one-way x 2 x onsite days per week, not just one-way).

    - name: role_scope_and_focus
      weight: 7
      description: >
        Describe what makes a role's day-to-day scope attractive vs.
        unattractive to you.

    - name: compensation_attractiveness
      weight: 6
      description: >
        Describe how stated vs. unstated salary should be scored.
